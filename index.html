<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MimoPet Ofertas — achadinhos pet para Belém-PA</title>
  <meta name="description" content="Canal de ofertas pet conferidas. A automação encontra. A MimoPet confere. O tutor economiza. Piloto em Belém-PA.">
  <link rel="canonical" href="https://www.mimopetofertas.com.br/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="MimoPet Ofertas">
  <meta property="og:description" content="Achadinhos e ofertas escolhidos com carinho para quem ama pets. Piloto Belém-PA.">
  <meta property="og:url" content="https://www.mimopetofertas.com.br/">
  <meta name="theme-color" content="#70452D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --marrom: #70452D;
      --caramelo: #C9823F;
      --creme: #F8F0E4;
      --terracota: #B9684A;
      --profundo: #3E2920;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Nunito, system-ui, sans-serif;
      background: var(--creme);
      color: var(--profundo);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    main {
      max-width: 36rem;
      text-align: center;
    }
    .mark {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: var(--marrom);
      color: var(--creme);
      display: grid;
      place-items: center;
      font-size: 1.75rem;
    }
    h1 {
      font-family: Fredoka, Nunito, sans-serif;
      font-weight: 600;
      font-size: clamp(1.75rem, 5vw, 2.4rem);
      color: var(--marrom);
      margin: 0 0 0.35rem;
    }
    .sig {
      color: var(--terracota);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin: 0 0 1.25rem;
    }
    .line {
      font-size: 1.15rem;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    p { margin: 0 0 0.85rem; line-height: 1.55; }
    .note {
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: var(--caramelo);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🐾</div>
    <h1>MimoPet</h1>
    <p class="sig">Ofertas</p>
    <p class="line">A automação encontra. A MimoPet confere. O tutor economiza.</p>
    <p>Achadinhos pet conferidos para tutores de cães e gatos. Piloto em Belém-PA.</p>
    <p>O canal público no Telegram entra no ar depois da curadoria. Sem preços inventados. Sem “X% off” falso.</p>
    <p class="note">www.mimopetofertas.com.br</p>
  </main>
</body>
</html>
